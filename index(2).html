<!doctype html><html lang="pt-BR"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fixtell Condomínios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar escura fixa + área principal com blocos por tipo; dentro de cada bloco, uma linha por letra com cards compactos ao lado. */
:root{
  --bg:#f3f2f0; --surface:#ffffff; --surface-2:#f8f7f5; --line:#e7e4df; --line-strong:#d6d2cb;
  --fg:#1d1b19; --muted:#78726b; --faint:#a8a199;
  --side:#1f1d1b; --side-fg:#ece8e3; --side-muted:#9d958b; --side-line:#34312e; --side-hover:#2b2926;
  --accent:#e2530a; --accent-2:#c84706; --accent-soft:#fff0e6; --accent-fg:#ffffff;
  --ok-bg:#dcf3e4; --ok-line:#98d2ac; --ok-fg:#1c7440;
  --warn-bg:#fdeceb; --warn-line:#f4b9b4; --warn-fg:#b3261e;
  --amber-bg:#fff4d6; --amber-fg:#8a5a00; --amber-line:#f1d48a;
  --neutral-bg:#efede9; --neutral-fg:#625c55;
  --cbl:94%; --cfl:32%; --cll:52%;
  --shadow:0 1px 2px rgba(30,20,10,.06),0 6px 20px rgba(30,20,10,.06);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#131211; --surface:#1d1b19; --surface-2:#252220; --line:#322f2b; --line-strong:#47433e;
  --fg:#f2eee9; --muted:#a39b91; --faint:#6f685f;
  --side:#0e0d0c; --side-fg:#ece8e3; --side-muted:#9d958b; --side-line:#262320; --side-hover:#1c1a18;
  --accent:#f26a21; --accent-2:#d9560f; --accent-soft:#33200f; --neutral-bg:#2a2724; --neutral-fg:#b9b1a7;
  --ok-bg:#16301f; --ok-line:#2c6b43; --ok-fg:#7fd6a0;
  --warn-bg:#35191a; --warn-line:#7a2d2a; --warn-fg:#ff9b94;
  --amber-bg:#352a0e; --amber-fg:#f0c25a; --amber-line:#6b5420;
  --cbl:20%; --cfl:76%; --cll:58%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
:root[data-theme="midnight"]{
  --bg:#0b1220; --surface:#111a2e; --surface-2:#162240; --line:#1f2c4a; --line-strong:#2f4170;
  --fg:#e8eefc; --muted:#93a3c7; --faint:#5f7099;
  --side:#070c18; --side-fg:#e1e8fa; --side-muted:#8193ba; --side-line:#172038; --side-hover:#101a30;
  --accent:#4d8dff; --accent-2:#2f6fe6; --accent-soft:#14254a; --neutral-bg:#1a2542; --neutral-fg:#a9b8dc;
  --ok-bg:#16301f; --ok-line:#2c6b43; --ok-fg:#7fd6a0;
  --warn-bg:#35191a; --warn-line:#7a2d2a; --warn-fg:#ff9b94;
  --amber-bg:#352a0e; --amber-fg:#f0c25a; --amber-line:#6b5420;
  --cbl:20%; --cfl:76%; --cll:58%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
:root[data-theme="ocean"]{
  --bg:#eef5f9; --surface:#ffffff; --surface-2:#f4f9fc; --line:#dbe7ef; --line-strong:#c3d4e0;
  --fg:#10242f; --muted:#5c7685; --faint:#93a9b6;
  --side:#0f2a3a; --side-fg:#e3f1f8; --side-muted:#8fb1c4; --side-line:#1d4258; --side-hover:#17384d;
  --accent:#0a7fb8; --accent-2:#07689a; --accent-soft:#e0f3fb; --neutral-bg:#e8f0f5; --neutral-fg:#4f6a79;
}
:root[data-theme="forest"]{
  --bg:#f1f4ee; --surface:#ffffff; --surface-2:#f6f8f3; --line:#dfe6d8; --line-strong:#c9d3c0;
  --fg:#1b241a; --muted:#66745f; --faint:#9aa793;
  --side:#1a2a1c; --side-fg:#e6efe3; --side-muted:#9cb29a; --side-line:#2c4230; --side-hover:#23382a;
  --accent:#2f8f4e; --accent-2:#247340; --accent-soft:#e2f4e7; --neutral-bg:#ebefe6; --neutral-fg:#5a6855;
}
:root[data-theme="violet"]{
  --bg:#f5f2fb; --surface:#ffffff; --surface-2:#faf8fe; --line:#e6e0f2; --line-strong:#d2c9e6;
  --fg:#1f1a2e; --muted:#74698f; --faint:#a59db9;
  --side:#231a36; --side-fg:#eee9f8; --side-muted:#a99ec4; --side-line:#3a2d57; --side-hover:#2e2247;
  --accent:#7c3aed; --accent-2:#6527d1; --accent-soft:#f0e8fe; --neutral-bg:#efebf7; --neutral-fg:#665b82;
}

/* aparência / mapa */
.themes{display:flex;flex-wrap:wrap;gap:8px;padding:4px 8px 2px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--side-line);padding:0;position:relative;overflow:hidden;background:none}
.sw i{position:absolute;inset:0}
.sw:hover{border-color:var(--side-muted)}
.sw.on{border-color:var(--side-fg);box-shadow:0 0 0 2px var(--accent)}
.themename{flex-basis:100%;font-size:11px;color:var(--side-muted);margin-top:2px}
.maplink{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--accent);text-decoration:none;padding:3px 9px;border-radius:99px;background:var(--accent-soft);border:1px solid transparent;width:fit-content;max-width:100%}
.maplink:hover{border-color:var(--accent)}
.maplink .ic{width:12px;height:12px}
.maplink.add{background:none;border:1px dashed var(--line-strong);color:var(--muted)}
.maplink.add:hover{color:var(--accent);border-color:var(--accent)}
.selo.shaft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.hint{font-size:11px;color:var(--faint);line-height:1.35}
.ro [data-act="add"],.ro [data-act="edit"],.ro [data-act="addmap"],.ro [data-act="reset"],.ro [data-act="imp"]{display:none!important}
.ro [data-act="conf"]{pointer-events:none}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.4;margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:18px;display:grid;place-items:center}
.brand b{display:block;font-size:16px;font-weight:700;line-height:1.1}
.brand small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);margin-top:3px}
.side h2{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);font-weight:600;margin:14px 8px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--side-fg);padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:500}
.nav:hover{background:var(--side-hover)}
.nav.on{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 2px 8px rgba(226,83,10,.35)}
.nav .n{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.16);border-radius:99px;padding:1px 8px;min-width:24px;text-align:center}
.nav:not(.on) .n{background:var(--side-line);color:var(--side-fg)}
.nav.warnbadge:not(.on) .n{background:var(--accent);color:#fff}
.side .grow{flex:1}
.sidefoot{border-top:1px solid var(--side-line);padding:12px 8px 2px;font-size:11.5px;color:var(--side-muted);line-height:1.5}

.mobbar{display:none}
.main{padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;max-width:1500px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:20px;margin:0 8px 0 0;font-weight:700;letter-spacing:-.01em}
.search{position:relative;flex:1 1 260px;max-width:460px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--warn-fg);border-color:var(--warn-line);background:var(--warn-bg)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.sel{padding:8px 10px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500}
.spacer{flex:1}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat span{display:block;font-size:11px;color:var(--muted);font-weight:500}
.stat b{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .bar{height:5px;border-radius:9px;background:var(--neutral-bg);margin-top:6px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--ok-fg);border-radius:9px}

.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.fchip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.fchip em{font-style:normal;font-weight:500;opacity:.7;font-variant-numeric:tabular-nums}
.fchip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.fchip.clear{border-style:dashed}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:18px;padding:14px 16px 6px}
.sechead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:2px 0 10px;text-align:left}
.sechead .ic.big{width:20px;height:20px;color:var(--accent)}
.sechead h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sechead small{color:var(--muted);font-size:12px}
.sechead .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .secbody{display:none}
.addteam{display:inline-flex;align-items:center;gap:7px;border:1px dashed var(--line-strong);background:var(--surface-2);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:600;margin:4px 0 12px;color:var(--fg)}
.addteam:hover{border-color:var(--accent);color:var(--accent)}
.row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.cell h4{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1}
.cell .meta{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font-size:12px}
.mini{width:24px;height:24px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--fg)}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px;align-items:start}

.card{--h:220;--s:80%;position:relative;background:var(--surface);border:1px solid hsl(var(--h) var(--s) var(--cll) / .45);border-left:3px solid hsl(var(--h) var(--s) var(--cll));border-radius:9px;padding:7px 9px 8px;display:flex;flex-direction:column;gap:5px;cursor:pointer;min-width:0}
.card:hover{box-shadow:var(--shadow)}
.card.done{background:var(--ok-bg);border-color:var(--ok-line);border-left-color:var(--ok-fg)}
.chead{display:flex;align-items:center;gap:6px}
.tchip{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:hsl(var(--h) var(--s) var(--cbl));color:hsl(var(--h) 70% var(--cfl));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card .go{margin-left:auto;border:0;background:none;padding:2px;color:var(--muted);display:grid;place-items:center;border-radius:6px}
.card .go:hover{background:var(--neutral-bg)}
.card.open .go .ic{transform:rotate(90deg)}
.selos{display:flex;gap:4px;flex-wrap:wrap}
.selo{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:1px 7px;background:var(--neutral-bg);color:var(--neutral-fg);border:1px solid var(--line)}
.selo .ic{width:10px;height:10px}
.selo.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-line)}
.selo.tag{background:var(--amber-bg);color:var(--amber-fg);border-color:var(--amber-line)}
.nome{font-size:13px;font-weight:700;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.005em}
.loc{display:flex;gap:5px;align-items:flex-start;color:var(--muted);font-size:11.5px;min-width:0}
.loc .ic{width:13px;height:13px;margin-top:1px}
.loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.loc.none span{font-style:italic;color:var(--faint)}
.stline{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);background:none;border:0;padding:0;text-align:left}
.stline .ic{width:13px;height:13px}
.stline.ok{color:var(--ok-fg)}
.stline:hover{color:var(--accent)}
.card.open .nome,.card.open .loc span{white-space:normal;overflow:visible}
.xbody{display:none;border-top:1px dashed var(--line-strong);padding-top:7px;margin-top:2px;flex-direction:column;gap:7px}
.card.open .xbody{display:flex}
.xbody dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px}
.xbody dt{color:var(--muted);font-weight:600}
.xbody dd{margin:0;overflow-wrap:anywhere}
.xbtns{display:flex;gap:6px}

.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}

.scrim{position:fixed;inset:0;background:rgba(10,8,6,.45);z-index:40}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(460px,100%);background:var(--surface);z-index:41;box-shadow:-12px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column}
.dhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:16px;flex:1}
.dform{overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;flex:1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lbl{font-size:11.5px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:8px 10px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface-2);width:100%}
.fld textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xrow{display:grid;grid-template-columns:1fr 1.3fr auto;gap:6px;margin-bottom:6px}
.xrow input{padding:7px 9px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface-2);min-width:0}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px}
.dfoot{display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.dfoot .spacer{flex:1}

.modal{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.modal p{margin:0 0 14px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:60;display:flex;gap:12px;align-items:center;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:0}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:45;transform:translateX(-102%);transition:transform .2s}
  .side.show{transform:none}
  .mobbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--side);color:var(--side-fg);position:sticky;top:0;z-index:30}
  .mobbar button{background:none;border:0;color:inherit;display:grid;place-items:center;padding:4px}
  .row{grid-template-columns:minmax(0,1fr);gap:8px}
  .cell{display:flex;align-items:center;gap:10px}
  .cell .meta{margin-top:0}
  .cell h4{font-size:18px}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>(function(){try{var p=localStorage.getItem('fixtell-tema')||'auto';var t=p==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):p;document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>

<div class="mobbar"><button type="button" data-act="menu" aria-label="Abrir menu"></button><span class="logo" style="width:26px;height:26px;font-size:14px;border-radius:7px">F</span><b>Fixtell</b></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">F</span><span><b>Fixtell</b><small>Condomínios e centers</small></span></div>
    <h2>Cadastro</h2>
    <div id="nav"></div>
    <h2>Aparência</h2>
    <div class="themes" id="themes"></div>
    <h2>Dados</h2>
    <button class="nav" type="button" data-act="exp-csv"><span data-ic="download"></span>Exportar CSV</button>
    <button class="nav" type="button" data-act="exp-json"><span data-ic="download"></span>Backup (JSON)</button>
    <button class="nav" type="button" data-act="imp"><span data-ic="upload"></span>Importar backup</button>
    <button class="nav" type="button" data-act="reset"><span data-ic="rotate"></span>Restaurar planilha</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <div class="grow"></div>
    <div class="sidefoot" id="savenote">Alterações ficam salvas neste navegador. Use o backup para levar os dados para outro lugar.</div>
  </aside>

  <main class="main">
    <div class="top">
      <h1 id="title">Todos os registros</h1>
      <div class="search"><span data-ic="search"></span><input id="q" type="search" placeholder="Buscar nome, localização, observação, campo…" aria-label="Buscar"></div>
      <label class="sr" for="grp" style="position:absolute;left:-9999px">Agrupar por</label>
      <select id="grp" class="sel"><option value="tipo">Agrupar por tipo</option><option value="origem">Agrupar por origem</option><option value="conf">Agrupar por conferência</option></select>
      <span class="spacer"></span>
      <button class="btn" type="button" data-act="qtheme" id="qtheme" title="Alternar claro/escuro" aria-label="Alternar claro/escuro"></button>
      <button class="btn primary" type="button" data-act="add"><span data-ic="plus"></span>Novo registro</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </main>
</div>

<div id="overlay"></div>
<datalist id="dl-tipos"></datalist>

const sleep = ms => new Promise(r => setTimeout(r, ms));
const clean = r => JSON.parse(JSON.stringify(r));
let wq = Promise.resolve();
const enqueue = fn => (wq = wq.then(fn).catch(() => {}));
async function withRetry(fn) {
  for (let i = 0; i < 4; i++) {
    try { return await fn(); }
    catch (e) { const c = e && e.code; if (c === 'unavailable' || c === 'resource_exhausted') { await sleep(700 * (i + 1) + Math.random() * 400); continue; } throw e; }
  }
  return fn();
}
function dbErr(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') { CAN_WRITE = false; toast('Sem permissão para salvar: seu acesso é somente leitura.'); }
  else if (c === 'quota_exceeded') toast('Limite de armazenamento da página atingido.');
  else toast('Não foi possível salvar agora. Tente de novo em instantes.');
  S.recs = remote.map(r => Object.assign({}, r)); setNote(noteShared()); render();
}
const dbSet = r => enqueue(async () => { try { await withRetry(() => DB.collection(COL).doc(r.id).set(clean(r))); } catch (e) { dbErr(e); } });
const dbDel = id => enqueue(async () => { try { await withRetry(() => DB.collection(COL).doc(id).delete()); } catch (e) { dbErr(e); } });
const persist = r => MODE === 'shared' ? dbSet(r) : save();
const persistDel = id => MODE === 'shared' ? dbDel(id) : save();
function applyAll(recs) {
  if (MODE !== 'shared') { S.recs = recs; save(); render(); return; }
  const keep = new Set(recs.map(r => r.id));
  const del = S.recs.filter(r => !keep.has(r.id)).map(r => r.id);
  S.recs = recs; render();
  enqueue(async () => {
    const total = del.length + recs.length; let n = 0;
    const tick = () => { if (++n % 10 === 0) setNote('Sincronizando… ' + n + '/' + total); };
    for (const id of del) { try { await withRetry(() => DB.collection(COL).doc(id).delete()); } catch (e) { return dbErr(e); } tick(); }
    for (const r of recs) { try { await withRetry(() => DB.collection(COL).doc(r.id).set(clean(r))); } catch (e) { return dbErr(e); } tick(); }
    setNote(noteShared()); toast('Dados atualizados para todos');
  });
}
async function seedMissing(existing) {
  if (!canEdit()) return;
  let m, lz;
  try { m = await DB.doc('config/seed').get(); if (m.exists && m.data().done) return; lz = await DB.doc('config/seed').acquire({ holder: HOLDER, ttlMs: 300000 }); } catch (e) { return; }
  if (!lz.acquired) return;
  const todo = SEED.filter(r => !existing.has(r.id));
  seeding = true; render();
  enqueue(async () => {
    let n = 0;
    for (const r of todo) {
      try { await withRetry(() => DB.collection(COL).doc(r.id).set(clean(migrate(Object.assign({}, r))))); } catch (e) { seeding = false; return dbErr(e); }
      if (++n % 10 === 0) setNote('Carregando a planilha pela primeira vez… ' + n + '/' + todo.length);
    }
    try { await DB.doc('config/seed').set({ done: true, at: Date.now() }); } catch (e) {}
    seeding = false; setNote(noteShared()); render();
  });
}
function emptyHTML() {
  if (MODE === 'pending') return '<div class="empty"><b>Conectando…</b>Carregando os dados compartilhados.</div>';
  if (seeding) return '<div class="empty"><b>Carregando a planilha pela primeira vez…</b>Os registros vão aparecendo aqui em instantes.</div>';
  return '<div class="empty"><b>Nenhum registro encontrado</b>Ajuste a busca ou os filtros, ou cadastre um novo registro.</div>';
}
async function boot() {
  let db = null;
  try { db = (window.claude && claude.use) ? await claude.use('db') : null; } catch (e) {}
  if (!db) { MODE = 'local'; load(); setNote(NOTE_LOCAL); render(); return; }
  DB = db;
  try { const u = await claude.use('user'); if (u && u.can) CAN_WRITE = await u.can('data.write'); } catch (e) {}
  MODE = 'shared'; setNote(noteShared()); render();
  const tmo = setTimeout(() => setNote('Ainda sem resposta do banco compartilhado. Os dados podem estar desatualizados.'), 10000);
  DB.collection(COL).onSnapshot(snap => {
    remote = snap.docs.map(d => migrate(Object.assign({}, d.data(), { id: d.id })));
    S.recs = remote.map(r => Object.assign({}, r));
    if (!snap.metadata.fromCache) {
      clearTimeout(tmo); setNote(noteShared());
      if (!seedChecked) { seedChecked = true; seedMissing(new Set(remote.map(r => r.id))); }
    }
    render();
  }, e => { clearTimeout(tmo); setNote('Não foi possível ler os dados compartilhados (' + ((e && e.code) || 'erro') + ').'); });
}
function loadUI() {
  try { const raw = localStorage.getItem(KEY + '-ui'); if (raw) { Object.assign(S.ui, JSON.parse(raw)); S.ui.q = ''; } } catch (e) {}
}

let S = { recs: [], ui: { view: 'todos', tipos: [], q: '', group: 'tipo', closed: [] } };
const open = new Set();
let saveFailed = false;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.recs)) { S.recs = d.recs.map(migrate); Object.assign(S.ui, d.ui || {}); S.ui.q = ''; return; } }
  } catch (e) {}
  S.recs = JSON.parse(JSON.stringify(SEED)).map(migrate);
}
function save() {
  try {
    const ui = { view: S.ui.view, tipos: S.ui.tipos, group: S.ui.group, closed: S.ui.closed };
    if (MODE !== 'local') localStorage.setItem(KEY + '-ui', JSON.stringify(ui));
    else localStorage.setItem(KEY, JSON.stringify({ recs: S.recs, ui }));
  }
  catch (e) { if (!saveFailed) { saveFailed = true; $('#savenote').textContent = 'Este navegador não permite salvar. Faça o backup (JSON) antes de sair.'; } }
}

const VIEWS = [
  ['todos', 'Todos os registros', 'layers', r => true],
  ['cond', 'Condomínios', 'building', r => r.origem === 'cond'],
  ['center', 'Centers e comerciais', 'store', r => r.origem === 'center'],
  ['sem', 'Sem localização', 'alert', r => !r.local],
  ['shaft', 'Shaft no térreo', 'building', r => r.shaft],
  ['semmapa', 'Sem link do mapa', 'pin', r => !r.mapa],
  ['conf', 'Conferidos', 'check', r => r.conferido]
];
const tipoOf = r => r.tipo || 'Sem tipo';
const letterOf = r => { const c = norm(r.nome).trim().charAt(0).toUpperCase(); return /[A-Z]/.test(c) ? c : '#'; };
const hay = r => norm([r.nome, r.tipo, r.local, r.obs, r.extId, r.clientes, (r.tags || []).join(' '), (r.extras || []).map(x => x.k + ' ' + x.v).join(' ')].join(' '));

function visible() {
  const v = VIEWS.find(x => x[0] === S.ui.view) || VIEWS[0];
  const q = norm(S.ui.q).trim();
  const ts = S.ui.tipos;
  return S.recs.filter(r => v[3](r) && (!ts.length || ts.includes(tipoOf(r))) && (!q || q.split(/\s+/).every(w => hay(r).includes(w))));
}

function renderNav() {
  $('#nav').innerHTML = VIEWS.map(v => {
    const n = S.recs.filter(v[3]).length;
    return '<button type="button" class="nav' + (S.ui.view === v[0] ? ' on' : '') + (v[0] === 'sem' ? ' warnbadge' : '') + '" data-act="view" data-v="' + v[0] + '">' + ic(v[2]) + v[1] + '<span class="n">' + n + '</span></button>';
  }).join('');
}
function renderStats() {
  const t = S.recs.length, com = S.recs.filter(r => r.local).length, cf = S.recs.filter(r => r.conferido).length;
  const pc = t ? Math.round(cf / t * 100) : 0;
  $('#stats').innerHTML =
    '<div class="stat"><span>Total cadastrado</span><b>' + t + '</b></div>' +
    '<div class="stat"><span>Com localização do splitter box</span><b>' + com + '</b><div class="bar"><i style="width:' + (t ? com / t * 100 : 0) + '%"></i></div></div>' +
    '<div class="stat"><span>Sem localização</span><b>' + (t - com) + '</b></div>' +
    '<div class="stat"><span>Com localização no mapa</span><b>' + S.recs.filter(r => r.mapa).length + '</b><div class="bar"><i style="width:' + (t ? S.recs.filter(r => r.mapa).length / t * 100 : 0) + '%"></i></div></div>' +
    '<div class="stat"><span>Shaft no térreo</span><b>' + S.recs.filter(r => r.shaft).length + '</b></div>' +
    '<div class="stat"><span>Conferidos</span><b>' + cf + ' <small style="font-size:12px;color:var(--muted);font-weight:500">' + pc + '%</small></b><div class="bar"><i style="width:' + pc + '%"></i></div></div>';
}
function renderChips() {
  const base = S.recs.filter((VIEWS.find(x => x[0] === S.ui.view) || VIEWS[0])[3]);
  const cnt = {}; base.forEach(r => { cnt[tipoOf(r)] = (cnt[tipoOf(r)] || 0) + 1; });
  const tips = Object.keys(cnt).sort(tipoSort(cnt));
  let h = tips.map(t => '<button type="button" class="fchip' + (S.ui.tipos.includes(t) ? ' on' : '') + '" data-act="ftipo" data-t="' + esc(t) + '">' + esc(t) + ' <em>' + cnt[t] + '</em></button>').join('');
  if (S.ui.tipos.length || S.ui.q) h += '<button type="button" class="fchip clear" data-act="clear">' + ic('x', '') + 'Limpar filtros</button>';
  $('#chips').innerHTML = h;
  const all = [...new Set(S.recs.map(tipoOf).filter(t => t !== 'Sem tipo'))];
  $('#dl-tipos').innerHTML = all.map(t => '<option value="' + esc(t) + '">').join('');
  const keys = new Set(); S.recs.forEach(r => (r.extras || []).forEach(x => x.k && keys.add(x.k)));
  ['Síndico', 'Contato', 'Endereço', 'Nº de unidades', 'Horário de acesso'].forEach(k => keys.add(k));
  $('#dl-keys').innerHTML = [...keys].map(k => '<option value="' + esc(k) + '">').join('');
}
function tipoSort(cnt) {
  const fixed = ['Apartamento', 'Casa'];
  return (a, b) => {
    const ra = a === 'Sem tipo' ? 9999 : fixed.indexOf(a) >= 0 ? fixed.indexOf(a) - 10000 : -cnt[a];
    const rb = b === 'Sem tipo' ? 9999 : fixed.indexOf(b) >= 0 ? fixed.indexOf(b) - 10000 : -cnt[b];
    return ra - rb || a.localeCompare(b, 'pt-BR');
  };
}

function cardHTML(r) {
  const t = tipoOf(r), h = hueOf(t), isOpen = open.has(r.id);
  const style = h == null ? '--h:30;--s:6%' : '--h:' + h;
  let selos = '';
  if (r.shaft) selos += '<span class="selo shaft">' + ic('building') + 'Shaft térreo</span>';
  if (!r.local) selos += '<span class="selo warn">' + ic('alert') + 'Sem local.</span>';
  if (r.obs) selos += '<span class="selo">' + ic('info') + 'Obs.</span>';
  (r.tags || []).slice(0, 2).forEach(g => { selos += '<span class="selo tag">' + esc(g) + '</span>'; });
  if ((r.tags || []).length > 2) selos += '<span class="selo tag">+' + (r.tags.length - 2) + '</span>';
  let det = '';
  const dl = [];
  if (r.local) dl.push(['Splitter box', r.local]);
  if (r.obs) dl.push(['Obs.', r.obs]);
  if (r.extId) dl.push(['ID', r.extId]);
  if (r.clientes) dl.push(['Clientes ativos', r.clientes]);
  (r.tags || []).forEach((g, i) => { if (i >= 2) dl.push(['Tag', g]); });
  (r.extras || []).forEach(x => dl.push([x.k, x.v]));
  det = '<div class="xbody">' + (dl.length ? '<dl>' + dl.map(d => '<dt>' + esc(d[0]) + '</dt><dd>' + esc(d[1]) + '</dd>').join('') + '</dl>' : '') +
    '<div class="xbtns"><button type="button" class="btn sm" data-act="edit" data-id="' + r.id + '">' + ic('pencil') + 'Editar</button></div></div>';
  return '<article class="card' + (r.conferido ? ' done' : '') + (isOpen ? ' open' : '') + '" style="' + style + '" data-id="' + r.id + '">' +
    '<div class="chead"><span class="tchip">' + esc(t) + '</span><button type="button" class="go" data-act="toggle" data-id="' + r.id + '" aria-label="Expandir" aria-expanded="' + isOpen + '">' + ic('chevR') + '</button></div>' +
    (selos ? '<div class="selos">' + selos + '</div>' : '') +
    '<div class="nome" title="' + esc(r.nome) + '">' + esc(r.nome) + '</div>' +
    '<div class="loc' + (r.local ? '' : ' none') + '">' + ic('pin') + '<span>' + esc(r.local || 'Localização não informada') + '</span></div>' +
    mapRow(r) +
    '<button type="button" class="stline' + (r.conferido ? ' ok' : '') + '" data-act="conf" data-id="' + r.id + '">' + ic(r.conferido ? 'check' : 'circle') + (r.conferido ? 'Conferido' : 'Marcar como conferido') + '</button>' +
    det + '</article>';
}

function groupKey(r) {
  const g = S.ui.group;
  if (g === 'origem') return r.origem === 'center' ? 'Centers e comerciais' : 'Condomínios';
  if (g === 'conf') return r.conferido ? 'Conferidos' : 'Pendentes de conferir';
  return tipoOf(r);
}
function render() {
  document.body.classList.toggle('ro', !canEdit());
  renderNav(); renderStats(); renderChips();
  $('#grp').value = S.ui.group;
  $('#title').textContent = (VIEWS.find(x => x[0] === S.ui.view) || VIEWS[0])[1];
  const rows = visible();
  if (!rows.length) {
    $('#list').innerHTML = emptyHTML();
    return;
  }
  const groups = {};
  rows.forEach(r => (groups[groupKey(r)] = groups[groupKey(r)] || []).push(r));
  const cnt = {}; Object.keys(groups).forEach(k => cnt[k] = groups[k].length);
  const keys = Object.keys(groups).sort(S.ui.group === 'tipo' ? tipoSort(cnt) : (a, b) => a.localeCompare(b, 'pt-BR'));
  $('#list').innerHTML = keys.map(k => {
    const list = groups[k].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    const semLoc = list.filter(r => !r.local).length;
    const byL = {}; list.forEach(r => (byL[letterOf(r)] = byL[letterOf(r)] || []).push(r));
    const letters = Object.keys(byL).sort((a, b) => a === '#' ? 1 : b === '#' ? -1 : a.localeCompare(b));
    const closed = S.ui.closed.includes(k);
    const icn = S.ui.group === 'tipo' ? tipoIcon(k) : S.ui.group === 'conf' ? 'check' : 'layers';
    const addT = S.ui.group === 'tipo' && k !== 'Sem tipo' ? k : '';
    const addO = list[0].origem;
    return '<section class="sec' + (closed ? ' closed' : '') + '">' +
      '<button type="button" class="sechead" data-act="sec" data-k="' + esc(k) + '">' + ic(icn, 'big') + '<h3>' + esc(k) + '</h3><small>' + list.length + ' registros' + (semLoc ? ' · ' + semLoc + ' sem localização' : '') + '</small>' + ic('chevD', 'chev') + '</button>' +
      '<div class="secbody"><button type="button" class="addteam" data-act="add" data-t="' + esc(addT) + '" data-o="' + addO + '">' + ic('plus') + 'Adicionar registro neste grupo</button>' +
      letters.map(L => '<div class="row"><div class="cell"><h4>' + L + '</h4><div class="meta">' + byL[L].length + ' reg.<button type="button" class="mini" data-act="add" data-t="' + esc(addT) + '" data-o="' + addO + '" aria-label="Adicionar com a letra ' + L + '">' + ic('plus') + '</button></div></div><div class="cards">' + byL[L].map(cardHTML).join('') + '</div></div>').join('') +
      '</div></section>';
  }).join('');
}

/* ---------- edição ---------- */
function xrow(k, v) {
  return '<div class="xrow"><input class="xk" list="dl-keys" placeholder="Campo (ex.: Síndico)" value="' + esc(k) + '" aria-label="Nome do campo"><input class="xv" placeholder="Valor" value="' + esc(v) + '" aria-label="Valor do campo"><button type="button" class="mini" data-act="xdel" aria-label="Remover campo" style="width:32px;height:32px">' + ic('x') + '</button></div>';
}

    '<label class="chk"><input type="checkbox" id="f-shaft"' + (r.shaft ? ' checked' : '') + '> Shaft no térreo</label>' +

    '<div class="fld"><label for="f-tags">Etiquetas (separe por vírgula)</label><input id="f-tags" value="' + esc((r.tags || []).join(', ')) + '" placeholder="Ex.: Precisa retirar, Prioridade"></div>' +
    '<div><div class="lbl" style="margin-bottom:6px">Outras informações</div><div id="f-extras">' + (r.extras || []).map(x => xrow(x.k, x.v)).join('') + '</div><button type="button" class="btn sm" data-act="xadd">' + ic('plus') + 'Adicionar informação</button></div>' +
    '<label class="chk"><input type="checkbox" id="f-conf"' + (r.conferido ? ' checked' : '') + '> Conferido</label>' +
    '</div>' +
    '<div class="dfoot">' + (id ? '<button type="button" class="btn danger" data-act="del" data-id="' + id + '">' + ic('trash') + 'Excluir</button>' : '') + '<span class="spacer"></span><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary">Salvar</button></div></form>';
  setTimeout(() => { const f = $('#f-nome'); if (f) f.focus(); }, 30);

function closeOverlay() { $('#overlay').innerHTML = ''; }
function submitForm(e) {
  e.preventDefault();
  const nome = $('#f-nome').value.trim();
  if (!nome) { $('#f-nome').focus(); $('#f-nome').style.borderColor = 'var(--warn-fg)'; return; }
  const id = $('#form').dataset.id;
  const data = {
    nome, origem: $('#f-origem').value, tipo: $('#f-tipo').value.trim(), local: $('#f-local').value.trim(), obs: $('#f-obs').value.trim(),
    extId: $('#f-extid').value.trim(), clientes: $('#f-cli').value.trim(), conferido: $('#f-conf').checked, mapa: $('#f-mapa').value.trim(), shaft: $('#f-shaft').checked,
    tags: $('#f-tags').value.split(',').map(s => s.trim()).filter(Boolean),
    extras: [...document.querySelectorAll('#f-extras .xrow')].map(r => ({ k: r.querySelector('.xk').value.trim(), v: r.querySelector('.xv').value.trim() })).filter(x => x.k)
  };
  let rec;
  if (id) { rec = S.recs.find(x => x.id === id); Object.assign(rec, data); }
  else { rec = Object.assign({ id: uid() }, data); S.recs.push(rec); open.add(rec.id); }
  persist(rec); closeOverlay(); render(); toast(id ? 'Registro atualizado' : 'Registro adicionado');
}

/* ---------- utilidades ---------- */
let tt;
function toast(msg, undo) {
  clearTimeout(tt);
  const el = $('#toast') || Object.assign(document.createElement('div'), { id: 'toast', className: 'toast' });
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button" data-act="undo">Desfazer</button>' : '');
  el.setAttribute('role', 'status');
  document.body.appendChild(el);
  tt = setTimeout(() => el.remove(), undo ? 7000 : 2600);
}
function ask(msg, label, fn) {
  const m = document.createElement('div');
  m.innerHTML = '<div class="scrim" style="z-index:49"></div><div class="modal" role="dialog"><p>' + esc(msg) + '</p><div class="acts"><button type="button" class="btn" data-x="no">Cancelar</button><button type="button" class="btn primary" data-x="ok">' + esc(label) + '</button></div></div>';
  document.body.appendChild(m);
  m.addEventListener('click', e => { const x = e.target.closest('[data-x]'); if (!x && !e.target.classList.contains('scrim')) return; m.remove(); if (x && x.dataset.x === 'ok') fn(); });
}
async function saveFile(filename, data) {
  try {
    const d = (window.claude && claude.use) ? await claude.use('downloads') : null;
    if (d) { await d.save({ filename, data }); return; }
    const blob = new Blob([data], { type: filename.endsWith('.json') ? 'application/json' : 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  } catch (e) { if (!e || e.code !== 'declined') toast('Não foi possível salvar o arquivo'); }
}
function exportCSV() {
  const keys = []; S.recs.forEach(r => (r.extras || []).forEach(x => { if (!keys.includes(x.k)) keys.push(x.k); }));
  const head = ['Nome', 'Origem', 'Tipo', 'Localização Splitter Box', 'Observações', 'ID', 'Clientes ativos', 'Conferido', 'Etiquetas', 'Link do mapa', 'Shaft no térreo'].concat(keys);
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [head.map(q).join(';')].concat(S.recs.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map(r =>
    [r.nome, r.origem === 'center' ? 'Center/comercial' : 'Condomínio', r.tipo, r.local, r.obs, r.extId, r.clientes, r.conferido ? 'Sim' : 'Não', (r.tags || []).join(', '), r.mapa || '', r.shaft ? 'Sim' : 'Não']
      .concat(keys.map(k => ((r.extras || []).find(x => x.k === k) || {}).v || '')).map(q).join(';')));
  saveFile('condominios-fixtell.csv', '﻿' + lines.join('\r\n'));
}

/* ---------- eventos ---------- */
let lastDel = null;
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a) {
    if (e.target.closest('a.maplink')) return;
    const card = e.target.closest('.card');
    if (card) openForm(card.dataset.id);
    return;
  }
  const act = a.dataset.act, id = a.dataset.id;
  if (act === 'view') { S.ui.view = a.dataset.v; S.ui.tipos = []; $('#side').classList.remove('show'); save(); render(); }
  else if (act === 'ftipo') { const t = a.dataset.t, i = S.ui.tipos.indexOf(t); i >= 0 ? S.ui.tipos.splice(i, 1) : S.ui.tipos.push(t); save(); render(); }
  else if (act === 'clear') { S.ui.tipos = []; S.ui.q = ''; $('#q').value = ''; save(); render(); }
  else if (act === 'sec') { const k = a.dataset.k, i = S.ui.closed.indexOf(k); i >= 0 ? S.ui.closed.splice(i, 1) : S.ui.closed.push(k); save(); render(); }
  else if (act === 'toggle') { open.has(id) ? open.delete(id) : open.add(id); render(); }
  else if (act === 'conf') { const r = S.recs.find(x => x.id === id); r.conferido = !r.conferido; persist(r); render(); }
  else if (act === 'edit') openForm(id);
  else if (act === 'addmap') { openForm(id); setTimeout(() => { const f = $('#f-mapa'); if (f) f.focus(); }, 60); }
  else if (act === 'theme') setTheme(a.dataset.t);
  else if (act === 'qtheme') setTheme(isDarkTheme(resolveTheme(themePref)) ? 'light' : 'dark');
  else if (act === 'add') openForm(null, { tipo: a.dataset.t || '', origem: a.dataset.o || 'cond', shaft: S.ui.view === 'shaft' });
  else if (act === 'close') closeOverlay();
  else if (act === 'xadd') { $('#f-extras').insertAdjacentHTML('beforeend', xrow('', '')); const k = document.querySelectorAll('#f-extras .xk'); k[k.length - 1].focus(); }
  else if (act === 'xdel') a.closest('.xrow').remove();
  else if (act === 'del') {
    ask('Excluir este registro? Você poderá desfazer logo depois.', 'Excluir', () => {
      const i = S.recs.findIndex(x => x.id === id); lastDel = { r: S.recs[i], i }; S.recs.splice(i, 1);
      persistDel(lastDel.r.id); closeOverlay(); render(); toast('Registro excluído', true);
    });
  }
  else if (act === 'undo') { if (lastDel) { S.recs.splice(lastDel.i, 0, lastDel.r); persist(lastDel.r); lastDel = null; render(); toast('Registro restaurado'); } }
  else if (act === 'menu') $('#side').classList.toggle('show');
  else if (act === 'exp-csv') exportCSV();
  else if (act === 'exp-json') saveFile('condominios-fixtell-backup.json', JSON.stringify({ versao: 1, recs: S.recs }, null, 1));
  else if (act === 'imp') $('#file').click();
  else if (act === 'reset') ask('Voltar aos dados originais da planilha? Isso apaga as alterações feitas' + (MODE === 'shared' ? ' para TODOS que usam esta página.' : ' aqui.'), 'Restaurar', () => { open.clear(); applyAll(JSON.parse(JSON.stringify(SEED)).map(migrate)); toast('Planilha original restaurada'); });
});
document.addEventListener('submit', e => { if (e.target.id === 'form') submitForm(e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });
$('#q').addEventListener('input', e => { S.ui.q = e.target.value; render(); });
$('#grp').addEventListener('change', e => { S.ui.group = e.target.value; save(); render(); });
$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result), arr = Array.isArray(d) ? d : d.recs;
      if (!Array.isArray(arr) || !arr.every(r => r && typeof r.nome === 'string')) throw 0;
      ask('Importar ' + arr.length + ' registros? Os dados atuais serão substituídos' + (MODE === 'shared' ? ' para TODOS que usam esta página' : '') + '.', 'Importar', () => {
        applyAll(arr.map(r => Object.assign({ origem: 'cond', tipo: '', local: '', obs: '', extId: '', clientes: '', conferido: false, tags: [], extras: [] }, r, { id: r.id || uid() })).map(migrate));
        toast('Backup importado');
      });
    } catch (x) { toast('Arquivo inválido. Use um backup (JSON) exportado daqui.'); }
  };
  rd.readAsText(f);
});

document.querySelectorAll('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });
document.querySelector('[data-act="menu"]').innerHTML = ic('menu');
loadUI(); renderThemes(); applyTheme(); render(); boot();
</script>

</body></html>
